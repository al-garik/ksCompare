url: https://ksCompare.github.io/ksCompare/

template:
  bootstrap: 5
  bslib:
    primary: "#4682b4"

home:
  title: ksCompare
  description: Smart data frame comparison in the spirit of SAS PROC COMPARE.

navbar:
