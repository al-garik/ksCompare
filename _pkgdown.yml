    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting started
        href: articles/getting-started.html
      - text: From PROC COMPARE
        href: articles/from-proc-compare.html
      - text: Smart features
        href: articles/smart-features.html
      - text: Reports
        href: articles/reports.html
      - text: Pipeline gates
        href: articles/pipeline-gates.html

reference:
- title: Compare
